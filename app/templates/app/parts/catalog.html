{% load static %}

{% if categories %}
	{% for category in categories %}
		<div class="col-md-6 col-xl-4 p-b-30 m-lr-auto">
			<div class="block1 wrap-pic-w">
				{% if category.image %}
					<img loading="lazy" class="block1-img" src="{{ category.image.url }}" alt="{{ category.name }}">
				{% else %}
					<img loading="lazy" class="block1-img" src="{% static 'images/banner-01.jpg' %}" alt="{{ category.name }}">
				{% endif %}

				<a href="{% url 'product' %}?category={{ category.slug }}" class="block1-txt ab-t-l s-full flex-col-l-sb p-lr-38 p-tb-34 trans-03 respon3">
					<div class="block1-txt-child1 flex-col-l category-text">
						<span class="block1-name ltext-102 trans-04">
							{{ category.name }}
						</span>

						{% comment %} <span class="block1-info stext-102 trans-04">
							Spring 2018
						</span> {% endcomment %}
					</div>

					<div class="block1-txt-child2 p-b-4 trans-05">
						<div class="block1-link stext-101 cl0 trans-09">
							Дивитись товари
						</div>
					</div>
				</a>
			</div>
		</div>
	{% endfor %}
{% else %}
	<!-- Fallback: single static block when no categories -->
	<div class="col-md-6 col-xl-4 p-b-30 m-lr-auto">
		<div class="block1 wrap-pic-w">
			<img loading="lazy" class="block1-img" src="{% static 'images/banner-01.jpg' %}" alt="IMG-BANNER">

			<a href="{% url 'product' %}" class="block1-txt ab-t-l s-full flex-col-l-sb p-lr-38 p-tb-34 trans-03 respon3">
				<div class="block1-txt-child1 flex-col-l">
					<span class="block1-name ltext-102 trans-04 p-b-8">
						Women
					</span>

					<span class="block1-info stext-102 trans-04">
						Spring 2018
					</span>
				</div>

				<div class="block1-txt-child2 p-b-4 trans-05">
					<div class="block1-link stext-101 cl0 trans-09">
						Shop Now
					</div>
				</div>
			</a>
		</div>
	</div>
{% endif %}
